services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Dev convenience only (connect a local psql/GUI client) - the backend reaches this
      # service via the "postgres" hostname on the compose network, not this host mapping.
      - '5432:5432'
    volumes:
      # Postgres 18+ manages a version-specific subdirectory itself (for pg_upgrade
      # compatibility) - mount one level above /data, not directly at it.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Everything in the root .env gets injected into this container's process.env.
    env_file:
      - .env
    environment:
      # Overrides .env's DATABASE_URL (which points at "localhost", for things running on the
      # host machine) with the in-network hostname - the "postgres" service is reachable by that
      # name only from other containers on this compose network, not from the host.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      # Overrides .env's NODE_ENV=development (meant for running the backend directly on the
      # host) - the image's own ENV NODE_ENV=production otherwise gets silently clobbered by
      # env_file below, which flips the logger to pino-pretty (a devDependency, not present in
      # this production image) and crashes the container on every start.
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${PORT}:${PORT}'
    healthcheck:
      # CMD-SHELL (not CMD) because we need shell variable expansion for ${PORT}.
      # wget --spider: just checks the URL responds, doesn't download/print the body.
      test: ['CMD-SHELL', 'wget --spider -q http://localhost:${PORT}/health || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Baked into the JS bundle at build time (see Dockerfile) - the backend's port is already
        # published to the host below, so the browser can reach it directly at this address, the
        # same way it reaches the backend's real public URL directly in production.
        VITE_BACKEND_ORIGIN: http://localhost:${PORT}
    ports:
      - '5173:3000'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost - BusyBox wget can resolve "localhost" to ::1 (IPv6) first and
      # fail a healthcheck the server itself answers fine, so this sidesteps that ambiguity
      # entirely rather than depending on which interface(s) the server happens to bind.
      test: ['CMD-SHELL', 'wget --spider -q http://127.0.0.1:3000/ || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
