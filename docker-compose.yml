services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Dev convenience only (connect a local psql/GUI client) - the backend reaches this
      # service via the "postgres" hostname on the compose network, not this host mapping.
      - '5432:5432'
    volumes:
      # Postgres 18+ manages a version-specific subdirectory itself (for pg_upgrade
      # compatibility) - mount one level above /data, not directly at it.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Everything in the root .env gets injected into this container's process.env.
    env_file:
      - .env
    environment:
      # Overrides .env's DATABASE_URL (which points at "localhost", for things running on the
      # host machine) with the in-network hostname - the "postgres" service is reachable by that
      # name only from other containers on this compose network, not from the host.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${PORT}:${PORT}'
    healthcheck:
      # CMD-SHELL (not CMD) because we need shell variable expansion for ${PORT}.
      # wget --spider: just checks the URL responds, doesn't download/print the body.
      test: ['CMD-SHELL', 'wget --spider -q http://localhost:${PORT}/health || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      # Read by nginx.conf.template (via envsubst) to know which port to reach the backend
      # service on, over the compose network - same value the backend itself listens on.
      BACKEND_PORT: ${PORT}
    ports:
      - '5173:80'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost - BusyBox wget resolves "localhost" to ::1 (IPv6) first, but
      # nginx's "listen 80" only binds IPv4, so that lookup order alone was enough to make an
      # otherwise-working nginx report unhealthy.
      test: ['CMD-SHELL', 'wget --spider -q http://127.0.0.1:80/ || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  postgres_data:
