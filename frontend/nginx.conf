server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Unknown paths get index.html, so a hard refresh on a client route like /videos works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Always revalidated, so a new deploy's asset filenames are picked up right away.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite puts a content hash in every asset filename, so these never change in place.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
